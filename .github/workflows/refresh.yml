name: Refresh sprint data

on:
  schedule:
    - cron: "30 10 * * *" # 6:30am ET (UTC-4 during EDT)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install cryptography certifi

      - name: Generate config
        env:
          SPRINT_GITHUB_TOKEN: ${{ secrets.SPRINT_GITHUB_TOKEN }}
        run: |
          python -c "
          import json, os
          json.dump({
            'github_token': os.environ['SPRINT_GITHUB_TOKEN'],
            'projects': [
              {'name': 'Podman Desktop', 'github_org': 'podman-desktop', 'github_project_number': 4},
              {'name': 'Kaiden', 'github_org': 'openkaiden', 'github_project_number': 1}
            ],
            'google_sa_key_path': '',
            'google_sheet_id': '1hMVvP2gUUwVjYDJapFZEcxge4bZi990r0xoihwv-l1E'
          }, open('config.json', 'w'), indent=2)
          "

      - name: Fetch data
        env:
          GOOGLE_SA_KEY_JSON: ${{ secrets.GOOGLE_SA_KEY_JSON }}
        run: python fetch_data.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sprint_data.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Refresh sprint data"
            for i in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
              echo "Push attempt $i failed, retrying..."
            done
            echo "Failed to push after 3 attempts" >&2
            exit 1
          fi
